<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>Tentaflake · Agent harness</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      background: #060c19;
      color: #edf5ff;
      font:
        16px system-ui,
        sans-serif;
    }
    main {
      position: relative;
      width: min(100vw, 1280px);
      aspect-ratio: 4/3;
      container-type: inline-size;
      margin: auto;
      overflow: hidden;
      background: radial-gradient(
        ellipse at 49% 34%,
        #122849 0,
        #0c192d 34%,
        #070f1e 68%,
        #050a14 100%
      );
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    header,
    footer {
      position: absolute;
      left: 4%;
      right: 4%;
      pointer-events: none;
    }
    header {
      top: 5%;
    }
    small,
    footer {
      font:
        500 1.12cqw ui-monospace,
        monospace;
      letter-spacing: 0.09em;
      color: #a6bbd7;
    }
    h1 {
      font-size: 4.15cqw;
      line-height: 1.1;
      letter-spacing: -0.05em;
      margin: 0.35cqw 0;
      color: #f1f6ff;
    }
    footer {
      bottom: 3.5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.18cqw;
      letter-spacing: 0.035em;
    }
    footer span {
      display: flex;
      align-items: center;
      gap: 0.7cqw;
    }
    i {
      display: inline-block;
      width: 0.68cqw;
      height: 0.68cqw;
      border-radius: 50%;
      background: #80e6ff;
    }
  </style>
  <main>
    <canvas
      aria-label="Eight agents carry cartridges between racks and terminals connected to the Tentaflake controller"
    ></canvas>
    <header>
      <small>AGENT INFRASTRUCTURE</small>
      <h1>Tentaflake</h1>
    </header>
    <footer>
      <span>08 isolated workstations</span><span><i></i>Job controller</span>
    </footer>
  </main>
  <script type="importmap">
    { "imports": { "three": "/three.module.js" } }
  </script>
  <script type="module" src="/scene.js"></script>
</html>
