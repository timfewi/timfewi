<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 468" width="880" height="468" role="img" aria-labelledby="t d"><title id="t">Agent harness benchmark scene (illustration)</title><desc id="d">Illustration with synthetic data. Agents at a shared table take the task 'repair routing and firewall' from a board and work with shell, ip route and nft. A corrected configuration goes into an isolated Linux network with a client, a router, a firewall and two services. Afterwards web traffic reaches the web service and traffic to the admin service stops at the firewall. An independent evaluator outside the network checks that web is reachable and admin is blocked, and the result reads pass.</desc><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.loop{animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}.task{animation-name:task}@keyframes task{0%,14%{stroke-opacity:1}22%,100%{stroke-opacity:0}}.chip{animation-name:chip;opacity:1}@keyframes chip{0%,100%{opacity:.45}}.c0{animation-name:c0}.c1{animation-name:c1}.c2{animation-name:c2}@keyframes c0{0%,8%{opacity:.45}12%,24%{opacity:1}28%,100%{opacity:.45}}@keyframes c1{0%,20%{opacity:.45}24%,34%{opacity:1}38%,100%{opacity:.45}}@keyframes c2{0%,30%{opacity:.45}34%,44%{opacity:1}48%,100%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite alternate}@keyframes bob{from{transform:translateY(0)}to{transform:translateY(2.5px)}}.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}.type{animation:type .45s ease-in-out infinite alternate}@keyframes type{from{transform:translateY(0)}to{transform:translateY(-3px)}}.config{animation-name:config}@keyframes config{0%,46%{opacity:0;transform:translate(-50px,34px)}48%{opacity:1;transform:translate(-50px,34px)}56%{opacity:1;transform:translate(116px,-80px)}59%,100%{opacity:0;transform:translate(116px,-80px)}}.gap{animation-name:gap}@keyframes gap{0%,57%{opacity:0}60%,94%{opacity:1}100%{opacity:0}}.applied{animation-name:applied;opacity:0}@keyframes applied{0%,56%{opacity:0}59%{opacity:.9}66%,100%{opacity:0}}.route{stroke-dasharray:1;stroke-dashoffset:0;animation-name:route}@keyframes route{0%,58%{stroke-dashoffset:1}70%,94%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}.deny{animation-name:deny}@keyframes deny{0%,70%{opacity:0}73%,94%{opacity:1}100%{opacity:0}}@keyframes ok{0%,60%{opacity:0;transform:translate(0,0)}60.5%{opacity:1;transform:translate(0,0)}62.86%{opacity:1;transform:translate(0px,73px)}66.78%{opacity:1;transform:translate(-66px,107px)}70.00%{opacity:1;transform:translate(-66px,189px)}72%,100%{opacity:0;transform:translate(-66px,189px)}}.pok{animation-name:ok;opacity:0}@keyframes bad{0%,61%{opacity:0;transform:translate(0,0)}61.5%{opacity:1;transform:translate(0,0)}64.51%{opacity:1;transform:translate(0px,73px)}69.42%{opacity:1;transform:translate(68px,107px)}70.00%{opacity:1;transform:translate(68px,119px)}72%,100%{opacity:0;transform:translate(68px,119px)}}.pbad{animation-name:bad;opacity:0}.probe{stroke-dasharray:5 6;animation:probe 1.2s linear infinite}@keyframes probe{to{stroke-dashoffset:-11}}.probes{animation-name:probes;opacity:.9}@keyframes probes{0%,72%{opacity:.25}76%,92%{opacity:.9}100%{opacity:.25}}.m0{animation-name:m0}.m1{animation-name:m1}@keyframes m0{0%,78%{opacity:0}81%,96%{opacity:1}100%{opacity:0}}@keyframes m1{0%,83%{opacity:0}86%,96%{opacity:1}100%{opacity:0}}.result{animation-name:result}@keyframes result{0%,87%{opacity:.3}90%,96%{opacity:1}100%{opacity:.3}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="100%" height="100%" fill="#f7f8fa"/><rect x="0" y="352" width="880" height="116" fill="#eceef2"/><path d="M334 290 L500 176" stroke="#c3c9d3" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round" fill="none"/><g transform="translate(0,0)"><rect x="24" y="24" width="230" height="140" rx="10" fill="#ebe6dc"/><text x="40" y="50" font-size="16" fill="#56606d">① task</text><rect x="40" y="62" width="198" height="88" rx="6" fill="#ffffff"/><rect x="40" y="62" width="198" height="88" rx="6" fill="none" stroke="#2943d6" stroke-width="2.5" class="loop task"/><rect x="40" y="62" width="5" height="88" rx="2" fill="#2943d6"/><text x="56" y="88" font-size="18" fill="#1c222b" font-weight="600">repair routing</text><text x="56" y="110" font-size="18" fill="#1c222b" font-weight="600">and firewall</text><text x="56" y="137" font-size="16" fill="#56606d">web <tspan fill="#1d7f46">✓</tspan>  admin <tspan fill="#c0392b">✗</tspan></text><g class="loop chip c0"><rect x="46.0" y="178" width="68.0" height="26" rx="13" fill="#ffffff" stroke="#c3c9d3"/><text x="80" y="196" font-size="16" fill="#1c222b" text-anchor="middle">shell</text></g><g class="loop chip c1"><rect x="141.6" y="178" width="96.8" height="26" rx="13" fill="#ffffff" stroke="#c3c9d3"/><text x="190" y="196" font-size="16" fill="#1c222b" text-anchor="middle">ip route</text></g><g class="loop chip c2"><rect x="275.6" y="178" width="48.8" height="26" rx="13" fill="#ffffff" stroke="#c3c9d3"/><text x="300" y="196" font-size="16" fill="#1c222b" text-anchor="middle">nft</text></g><g class="bob" style="animation-delay:-0.0s"><line x1="80" y1="222" x2="80" y2="211" stroke="#2f9e8f" stroke-width="3"/><circle cx="80" cy="209" r="4.5" fill="#2f9e8f"/><rect x="52" y="222" width="56" height="42" rx="14" fill="#2f9e8f"/><rect x="60" y="231" width="40" height="21" rx="8" fill="#1c222b"/><g class="blink" style="animation-delay:-0.0s"><circle cx="72" cy="241.5" r="3.6" fill="#b9f5ea"/><circle cx="88" cy="241.5" r="3.6" fill="#b9f5ea"/></g><rect x="50" y="266" width="60" height="60" rx="16" fill="#2f9e8f" opacity=".85"/></g><rect x="46" y="290" width="68" height="40" rx="4" fill="#9aa3b0"/><circle cx="80" cy="309" r="4" fill="#b9f5ea" opacity=".8"/><circle class="type" cx="40" cy="324" r="6" fill="#2f9e8f"/><ci